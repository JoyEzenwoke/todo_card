<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo Card</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <main class="container">
    
    <!-- ROOT CARD -->
    <article data-testid="test-todo-card" class="todo-card">

      <!-- TITLE -->
      <h2 data-testid="test-todo-title" class="todo-title">
        Design Landing Page
      </h2>

      <!-- DESCRIPTION -->
      <p data-testid="test-todo-description" class="todo-description">
        Create a modern responsive landing page for the new product launch.
      </p>

      <!-- PRIORITY -->
      <span 
        data-testid="test-todo-priority" 
        class="badge priority high"
        aria-label="High Priority"
      >
        High
      </span>

      <!-- STATUS -->
      <span 
        data-testid="test-todo-status" 
        class="badge status"
        aria-label="Task status"
      >
        Pending
      </span>

      <!-- DUE DATE -->
      <time 
        data-testid="test-todo-due-date" 
        class="due-date"
        datetime="2026-03-01T18:00:00Z"
      >
        Due Mar 1, 2026
      </time>

      <!-- TIME REMAINING -->
      <p 
        data-testid="test-todo-time-remaining" 
        class="time-remaining"
        aria-live="polite"
      >
        Calculating...
      </p>

      <!-- CHECKBOX -->
      <div class="checkbox-container">
        <input 
          type="checkbox" 
          id="complete"
          data-testid="test-todo-complete-toggle"
        />
        <label for="complete">Mark as completed</label>
      </div>

      <!-- TAGS -->
      <ul data-testid="test-todo-tags" class="tags" role="list">
        <li data-testid="test-todo-tag-work">Work</li>
        <li data-testid="test-todo-tag-urgent">Urgent</li>
        <li>Design</li>
      </ul>

      <!-- ACTION BUTTONS -->
      <div class="actions">
        <button 
          data-testid="test-todo-edit-button" 
          aria-label="Edit task"
        >
          Edit
        </button>

        <button 
          data-testid="test-todo-delete-button" 
          aria-label="Delete task"
        >
          Delete
        </button>
      </div>

    </article>

  </main>

  <script src="script.js"></script>
</body>
</html>
