<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Todo Card</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<main class="container">

<article data-testid="test-todo-card" class="todo-card">

  <!-- PRIORITY INDICATOR -->
  <div data-testid="test-todo-priority-indicator" class="priority-indicator high"></div>

  <!-- TITLE -->
  <h2 data-testid="test-todo-title" class="todo-title">
    Design Landing Page
  </h2>

  <!-- COLLAPSIBLE -->
  <div 
    id="collapsible-section"
    data-testid="test-todo-collapsible-section"
    class="collapsible"
  >
    <p data-testid="test-todo-description">
      Create a modern responsive landing page for the new product launch with animations, responsiveness and accessibility best practices.
    </p>
  </div>

  <button 
    data-testid="test-todo-expand-toggle"
    aria-expanded="false"
    aria-controls="collapsible-section"
  >
    Show More
  </button>

  <!-- PRIORITY -->
  <span data-testid="test-todo-priority" class="badge">High</span>

  <!-- STATUS -->
  <span data-testid="test-todo-status" class="badge">Pending</span>

  <!-- STATUS CONTROL -->
  <select data-testid="test-todo-status-control" aria-label="Task status control">
    <option>Pending</option>
    <option>In Progress</option>
    <option>Done</option>
  </select>

  <!-- DATE -->
  <time data-testid="test-todo-due-date" datetime="2026-04-18T18:00">
    Due Apr 18, 2026
  </time>

  <!-- TIME -->
  <p data-testid="test-todo-time-remaining" aria-live="polite"></p>

  <!-- OVERDUE -->
  <span data-testid="test-todo-overdue-indicator" class="overdue hidden">
    Overdue
  </span>

  <!-- CHECKBOX -->
  <div>
    <input type="checkbox" id="todo-check" data-testid="test-todo-complete-toggle"/>
    <label for="todo-check">Mark as completed</label>
  </div>

  <!-- TAGS -->
  <ul data-testid="test-todo-tags">
    <li data-testid="test-todo-tag-work">Work</li>
    <li data-testid="test-todo-tag-urgent">Urgent</li>
  </ul>

  <!-- ACTIONS -->
  <div class="actions">
    <button data-testid="test-todo-edit-button">Edit</button>
    <button data-testid="test-todo-delete-button">Delete</button>
  </div>

  <!-- EDIT FORM -->
  <form data-testid="test-todo-edit-form" class="edit-form hidden">

    <label for="edit-title">Title</label>
    <input id="edit-title" data-testid="test-todo-edit-title-input"/>

    <label for="edit-desc">Description</label>
    <textarea id="edit-desc" data-testid="test-todo-edit-description-input"></textarea>

    <label for="edit-priority">Priority</label>
    <select id="edit-priority" data-testid="test-todo-edit-priority-select">
      <option>Low</option>
      <option>Medium</option>
      <option>High</option>
    </select>

    <label for="edit-date">Due Date</label>
    <input type="datetime-local" id="edit-date" data-testid="test-todo-edit-due-date-input"/>

    <button type="button" data-testid="test-todo-save-button">Save</button>
    <button type="button" data-testid="test-todo-cancel-button">Cancel</button>

  </form>

</article>

</main>

<script src="script.js"></script>
</body>
</html>
